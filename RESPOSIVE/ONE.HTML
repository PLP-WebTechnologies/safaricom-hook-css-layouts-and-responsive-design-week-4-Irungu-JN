<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Webpage</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --secondary-color: #f4f4f4;
      --text-color: #333;
      --padding: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      margin: 0;
    }

    header {
      background: var(--primary-color);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--padding);
    }

    header .logo {
      font-size: 1.5em;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    nav a:hover {
      color: #333;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--padding);
      padding: var(--padding);
    }

    .main-content .text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .main-content .image img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    footer {
      background: var(--primary-color);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--padding);
    }

    footer .social-media a {
      margin: 0 5px;
      text-decoration: none;
      color: white;
    }

    footer .social-media a:hover {
      color: #333;
    }

    /* Media Queries */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        text-align: center;
      }

      nav {
        flex-direction: column;
      }

      .main-content {
        grid-template-columns: 1fr;
      }

      footer {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (min-width: 601px) and (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    @media (min-width: 1025px) {
      .main-content {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Transitions */
    header, .main-content, footer {
      transition: all 0.3s ease-in-out;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">My Website</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="main-content">
    <div class="text">
      <h1>Welcome to My Responsive Webpage</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse ultricies justo vel nulla sodales, et egestas nisi dapibus.</p>
    </div>
    <div class="image">
      <img src="bird2.jpeg" alt="Placeholder Image">
    </div>
  </main>

  <footer>
    <div class="social-media">
      <a href="#">Facebook</a>
      <a href="#">Twitter</a>
      <a href="#">Instagram</a>
    </div>
    <div>&copy; 2025 My Website</div>
  </footer>
</body>
</html>
